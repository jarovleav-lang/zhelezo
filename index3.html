<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Железо">
<meta name="theme-color" content="#0a0a08">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230a0a08'/%3E%3Crect x='10' y='42' width='10' height='16' rx='1' fill='%23b08d57'/%3E%3Crect x='22' y='34' width='8' height='32' rx='1' fill='%23b08d57'/%3E%3Crect x='32' y='47' width='36' height='6' fill='%23e9e7dd'/%3E%3Crect x='70' y='34' width='8' height='32' rx='1' fill='%23b08d57'/%3E%3Crect x='80' y='42' width='10' height='16' rx='1' fill='%23b08d57'/%3E%3C/svg%3E">
<title>Железо</title>
<style>
:root{
  --bg:#0a0a08; --panel:#15160f; --panel2:#1c1e16; --line:#2a2c22;
  --ink:#e9e7dd; --muted:#8d8f80; --accent:#b08d57; --accent2:#8fae7a;
  --danger:#c1503f; --pr:#d9a441;
  --fd: 800 1em/1.05 -apple-system, system-ui, sans-serif;
  --fb: 400 1em/1.4 -apple-system, system-ui, sans-serif;
  --fm: ui-monospace, "SF Mono", Menlo, monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:-apple-system,system-ui,sans-serif; overscroll-behavior-y:none;}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom));}
#app{max-width:560px; margin:0 auto; min-height:100vh;}
.hdr{position:sticky; top:0; z-index:5; background:linear-gradient(180deg,var(--bg) 80%,transparent); padding:calc(14px + env(safe-area-inset-top)) 16px 6px;}
.eyebrow{font:700 10px/1 var(--fm); color:var(--accent); letter-spacing:.14em; text-transform:uppercase;}
h1{font:var(--fd); font-size:26px; text-transform:uppercase; letter-spacing:.01em; margin:4px 0 2px; color:var(--ink);}
.pmuted{color:var(--muted); font-size:13px; margin:0;}
.content{padding:6px 16px 24px;}
.card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px;}
.btn{font:700 14px/1 var(--fb); text-transform:uppercase; letter-spacing:.03em; border:1px solid var(--line); background:var(--panel2); color:var(--ink); padding:13px 16px; border-radius:8px; text-align:center; display:block; width:100%;}
.btn:active{opacity:.7;}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#0a0a08;}
.btn.ghost{background:transparent;}
.btn.danger{background:transparent; border-color:var(--danger); color:var(--danger);}
.btn.small{width:auto; padding:8px 12px; font-size:12px;}
.row{display:flex; gap:8px;}
.row > *{flex:1;}
.tabbar{position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--panel); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); z-index:10;}
.tab{flex:1; text-align:center; padding:10px 4px 8px; color:var(--muted); font:700 10px/1 var(--fm); text-transform:uppercase; letter-spacing:.06em; background:none; border:none;}
.tab.active{color:var(--accent);}
.tab .ic{display:block; font-size:18px; margin-bottom:3px;}
.exline{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line);}
.exline:last-child{border-bottom:none;}
.exname{font-weight:600; font-size:14.5px;}
.exmeta{font:11px var(--fm); color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
.setrow{display:grid; grid-template-columns:26px 1fr 1fr 40px; gap:8px; align-items:center; margin-bottom:6px;}
.setrow .idx{font:12px var(--fm); color:var(--muted); text-align:center;}
.numin{width:100%; font:600 16px var(--fm); text-align:center; background:var(--panel2); border:1px solid var(--line); color:var(--ink); border-radius:6px; padding:9px 2px;}
.setrow.done .numin{border-color:var(--accent2); background:#1c2419;}
.check{width:36px; height:36px; border-radius:6px; border:1px solid var(--line); background:var(--panel2); color:var(--muted); font-size:17px; display:flex; align-items:center; justify-content:center;}
.setrow.done .check{background:var(--accent2); border-color:var(--accent2); color:#0a0a08;}
.pr-badge{display:inline-block; font:700 9px var(--fm); color:#0a0a08; background:var(--pr); padding:2px 5px; border-radius:4px; letter-spacing:.05em; margin-left:6px;}
.super-badge{font:10px var(--fm); color:var(--accent); border:1px solid var(--accent); border-radius:4px; padding:1px 5px; margin-left:6px;}
.plates{margin-top:6px; padding:8px; background:var(--panel2); border-radius:6px; font:12px var(--fm); color:var(--muted); display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
.plate-chip{display:inline-flex; align-items:center; gap:4px; color:var(--ink);}
.plate-dot{width:10px; height:10px; border-radius:50%; display:inline-block;}
.linkbtn{background:none; border:none; color:var(--accent); font:600 12px var(--fm); text-transform:uppercase; letter-spacing:.04em; padding:4px 0;}
select,input[type=text],input[type=number]{background:var(--panel2); border:1px solid var(--line); color:var(--ink); border-radius:6px; padding:10px; font:14px -apple-system,sans-serif; width:100%;}
label{display:block; font:11px var(--fm); color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px; margin-top:12px;}
.timer-fab{position:fixed; right:14px; bottom:calc(72px + env(safe-area-inset-bottom)); width:60px; height:60px; border-radius:50%; z-index:9; border:none; display:flex; align-items:center; justify-content:center; flex-direction:column;}
.spark{width:100%; height:56px; display:block;}
.hist-item{padding:10px 0; border-bottom:1px solid var(--line);}
.hist-item:last-child{border-bottom:none;}
.hist-top{display:flex; justify-content:space-between; font:700 13px var(--fb);}
.hist-sub{font:11px var(--fm); color:var(--muted); margin-top:2px;}
.grp{font:700 10px var(--fm); color:var(--accent); text-transform:uppercase; letter-spacing:.08em; margin:16px 0 4px;}
.empty{text-align:center; color:var(--muted); font-size:13px; padding:30px 10px;}
.toast{position:fixed; left:16px; right:16px; bottom:calc(74px + env(safe-area-inset-bottom)); background:var(--accent2); color:#0a0a08; font:700 13px var(--fb); padding:12px; border-radius:8px; text-align:center; z-index:20;}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

/* ============ ДАННЫЕ ПРОГРАММЫ ============ */
var EXO = [
  {id:'bench_bb',    name:'Жим штанги лёжа',                 type:'barbell',   group:'Грудь'},
  {id:'incline_db',  name:'Жим гантелей на наклонной скамье', type:'dumbbell',  group:'Грудь'},
  {id:'pec_deck',    name:'Бабочка',                          type:'machine',   group:'Грудь'},
  {id:'lat_raise',   name:'Махи гантелями в стороны',         type:'dumbbell',  group:'Плечи', seed:5},
  {id:'lat_pulldown',name:'Верхняя тяга',                     type:'machine',   group:'Спина'},
  {id:'seated_row',  name:'Горизонтальная тяга',              type:'machine',   group:'Спина'},
  {id:'triceps_rope',name:'Разгибание на блоке (канат)',      type:'machine',   group:'Трицепс'},
  {id:'bicep_curl',  name:'Подъём гантелей на бицепс',        type:'dumbbell',  group:'Бицепс', seed:9},
  {id:'hammer_curl', name:'Молотки',                          type:'dumbbell',  group:'Бицепс'},
  {id:'leg_raise',   name:'Подъём коленей в висе',            type:'bodyweight',group:'Пресс'},
  {id:'ohp_db',      name:'Жим гантелей над головой сидя',    type:'dumbbell',  group:'Плечи'},
  {id:'rear_delt',   name:'Махи в наклоне (задняя дельта)',   type:'dumbbell',  group:'Плечи'},
  {id:'flat_db_press',name:'Жим гантелей лёжа',               type:'dumbbell',  group:'Грудь'},
  {id:'leg_press',   name:'Жим ногами',                       type:'machine',   group:'Ноги', seed:90},
  {id:'leg_curl',    name:'Сгибание ног лёжа',                type:'machine',   group:'Ноги'},
  {id:'hyper',       name:'Гиперэкстензия с блином',          type:'plate',     group:'Поясница', seed:10},
  {id:'squat_bb',    name:'Приседания со штангой',            type:'barbell',   group:'Ноги'},
  {id:'deadlift',    name:'Становая тяга',                    type:'barbell',   group:'Спина'},
  {id:'ohp_bb',      name:'Жим штанги стоя',                  type:'barbell',   group:'Плечи'},
  {id:'bent_row_bb', name:'Тяга штанги в наклоне',             type:'barbell',   group:'Спина'},
  {id:'db_flye',     name:'Разведение гантелей лёжа',          type:'dumbbell',  group:'Грудь'},
  {id:'crunch',      name:'Скручивания на пресс',             type:'bodyweight',group:'Пресс'},
  {id:'db_lunge',    name:'Выпады с гантелями',                type:'dumbbell',  group:'Ноги'},
  {id:'calf_raise',  name:'Подъём на носки стоя',              type:'machine',   group:'Икры'},
  {id:'smith_bench', name:'Жим лёжа в Смите',                  type:'machine',   group:'Грудь'},
  {id:'smith_incline',name:'Жим на наклонной скамье в Смите',  type:'machine',   group:'Грудь'},
  {id:'smith_squat', name:'Присед в Смите',                    type:'machine',   group:'Ноги'},
  {id:'cable_crunch',name:'Кранч на блоке',                    type:'machine',   group:'Пресс'},
  {id:'plank',       name:'Планка',                            type:'bodyweight',group:'Пресс'}
];

var PROGRAM = {
  A: { label:'Тренировка A', sub:'Грудь · спина · руки · пресс', items:[
    {ex:'bench_bb', sets:4, reps:'8–10'},
    {ex:'incline_db', sets:3, reps:'10'},
    {ex:'pec_deck', sets:3, reps:'12'},
    {ex:'lat_raise', sets:4, reps:'12'},
    {ex:'lat_pulldown', sets:4, reps:'10'},
    {ex:'seated_row', sets:3, reps:'10'},
    {ex:'triceps_rope', sets:3, reps:'10'},
    {ex:'bicep_curl', sets:4, reps:'10', pair:'hammer_curl'},
    {ex:'hammer_curl', sets:4, reps:'10', pair:'bicep_curl'},
    {ex:'leg_raise', sets:3, reps:'15'}
  ]},
  B: { label:'Тренировка B', sub:'Плечи · спина · ноги · поясница', items:[
    {ex:'ohp_db', sets:4, reps:'8–10'},
    {ex:'lat_raise', sets:4, reps:'12'},
    {ex:'rear_delt', sets:3, reps:'12'},
    {ex:'flat_db_press', sets:3, reps:'12'},
    {ex:'lat_pulldown', sets:4, reps:'10'},
    {ex:'seated_row', sets:3, reps:'10'},
    {ex:'leg_press', sets:4, reps:'10'},
    {ex:'leg_curl', sets:3, reps:'12'},
    {ex:'bicep_curl', sets:4, reps:'10', pair:'hammer_curl'},
    {ex:'hammer_curl', sets:4, reps:'10', pair:'bicep_curl'},
    {ex:'hyper', sets:3, reps:'12'}
  ]},
  /* ---- Железо 3: Пн / Ср / Сб, 60–75 мин ---- */
  D1: { label:'Железо 3 · Пн', sub:'Грудь · спина · бицепс · пресс', items:[
    {ex:'smith_bench', sets:4, reps:'6–8'},
    {ex:'incline_db', sets:3, reps:'8–10'},
    {ex:'lat_pulldown', sets:3, reps:'10'},
    {ex:'seated_row', sets:3, reps:'10'},
    {ex:'lat_raise', sets:3, reps:'12–15'},
    {ex:'bicep_curl', sets:3, reps:'10', pair:'hammer_curl'},
    {ex:'hammer_curl', sets:3, reps:'10', pair:'bicep_curl'},
    {ex:'leg_raise', sets:3, reps:'12–15'},
    {ex:'cable_crunch', sets:3, reps:'10–12'}
  ]},
  D2: { label:'Железо 3 · Ср', sub:'Ноги · плечи · трицепс · пресс', items:[
    {ex:'smith_squat', sets:4, reps:'8–10'},
    {ex:'leg_press', sets:3, reps:'10–12'},
    {ex:'leg_curl', sets:3, reps:'12'},
    {ex:'ohp_db', sets:3, reps:'8–10'},
    {ex:'rear_delt', sets:3, reps:'12'},
    {ex:'triceps_rope', sets:3, reps:'10'},
    {ex:'cable_crunch', sets:3, reps:'10–12'},
    {ex:'plank', sets:3, reps:'30–40 сек'}
  ]},
  D3: { label:'Железо 3 · Сб', sub:'Грудь · плечи · спина · бицепс · пресс', note:'Наклонный жим в Смите: оставлять 2 повтора в запасе (грудь работает и в понедельник).', items:[
    {ex:'smith_incline', sets:3, reps:'8–10'},
    {ex:'pec_deck', sets:3, reps:'12'},
    {ex:'lat_raise', sets:4, reps:'12'},
    {ex:'lat_pulldown', sets:3, reps:'10'},
    {ex:'seated_row', sets:3, reps:'10'},
    {ex:'bicep_curl', sets:3, reps:'10', pair:'hammer_curl'},
    {ex:'hammer_curl', sets:3, reps:'10', pair:'bicep_curl'},
    {ex:'leg_raise', sets:3, reps:'12–15'},
    {ex:'cable_crunch', sets:3, reps:'10–12'},
    {ex:'hyper', sets:2, reps:'12'}
  ]}
};

var PLATE_SET = [
  {w:25,  c:'#c1503f'}, {w:20, c:'#3f6fa6'}, {w:15, c:'#d9c23a'},
  {w:10,  c:'#4f8f4f'}, {w:5,  c:'#e9e7dd'}, {w:2.5,c:'#2a2c22'},
  {w:1.25,c:'#9aa08f'}, {w:0.5,c:'#6f7364'}
];

/* ============ STATE ============ */
var STORE_KEY = 'zhelezo_v2';
var state = load();

function load(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { sessions:[], active:null, custom:[], settings:{barWeight:20, restSeconds:90} };
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

function allExercises(){ return EXO.concat(state.custom || []); }
function exById(id){ return allExercises().find(function(e){ return e.id===id; }); }

function lastSessionOfType(type){
  for(var i=state.sessions.length-1;i>=0;i--){ if(state.sessions[i].type===type) return state.sessions[i]; }
  return null;
}
function nextType(){
  /* Железо 3: D1 → D2 → D3 → D1. Если последняя тренировка была из старой программы A/B, начинаем с D1. */
  if(!state.sessions.length) return 'D1';
  var last = state.sessions[state.sessions.length-1];
  var cycle = {D1:'D2', D2:'D3', D3:'D1'};
  return cycle[last.type] || 'D1';
}
function lastWeightFor(exId){
  for(var i=state.sessions.length-1;i>=0;i--){
    var entry = state.sessions[i].entries.find(function(e){ return e.ex===exId; });
    if(entry && entry.sets.length){
      var max = 0;
      entry.sets.forEach(function(s){ if(s.weight>max) max=s.weight; });
      if(max>0) return max;
    }
  }
  return null;
}
function prFor(exId){
  var max = 0;
  state.sessions.forEach(function(s){
    var entry = s.entries.find(function(e){ return e.ex===exId; });
    if(entry) entry.sets.forEach(function(st){ if(st.weight>max) max=st.weight; });
  });
  return max;
}
function volumeOf(session){
  var v=0;
  session.entries.forEach(function(e){ e.sets.forEach(function(s){ v += (s.weight||0)*(s.reps||0); }); });
  return v;
}

/* ============ ТАЙМЕР ОТДЫХА ============ */
var timer = { total:0, remaining:0, running:false, iv:null };
function timerStart(sec){
  clearInterval(timer.iv);
  timer.total = sec; timer.remaining = sec; timer.running = true;
  timer.iv = setInterval(function(){
    timer.remaining--;
    if(timer.remaining<=0){ clearInterval(timer.iv); timer.running=false; timer.remaining=0; beep(); if(navigator.vibrate) navigator.vibrate([200,80,200]); }
    renderTimerFab();
  }, 1000);
  renderTimerFab();
}
function timerAdjust(d){ timer.remaining = Math.max(0, timer.remaining+d); timer.total = Math.max(timer.total, timer.remaining); renderTimerFab(); }
function beep(){
  try{
    var ctx = new (window.AudioContext||window.webkitAudioContext)();
    var o = ctx.createOscillator(); var g = ctx.createGain();
    o.type='sine'; o.frequency.value=880; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.2, ctx.currentTime);
    o.start(); o.stop(ctx.currentTime+0.5);
  }catch(e){}
}
function renderTimerFab(){
  var fab = document.getElementById('timerFab');
  if(!fab) return;
  var pct = timer.total ? Math.round(100*(timer.total-timer.remaining)/timer.total) : 0;
  fab.style.background = 'conic-gradient(var(--accent) '+pct+'%, var(--panel2) 0)';
  var mm = Math.floor(timer.remaining/60), ss = timer.remaining%60;
  fab.querySelector('.tlabel').textContent = timer.running || timer.remaining>0 ? (mm+':'+(ss<10?'0':'')+ss) : '⏱';
}

/* ============ PLATE CALC ============ */
function calcPlates(target, bar){
  bar = bar || state.settings.barWeight || 20;
  var side = (target - bar) / 2;
  if(side <= 0) return null;
  var res = [];
  PLATE_SET.forEach(function(p){
    var cnt = Math.floor((side+1e-6)/p.w);
    if(cnt>0){ res.push({w:p.w, c:p.c, n:cnt}); side -= cnt*p.w; }
  });
  return res;
}
function calcSinglePlate(target){
  var best = null, bestDiff = 1e9;
  PLATE_SET.forEach(function(p){ var d = Math.abs(p.w-target); if(d<bestDiff){ bestDiff=d; best=p; } });
  return best;
}

/* ============ РЕНДЕР: КОРЕНЬ ============ */
var TAB = 'zal';
function render(){
  var app = document.getElementById('app');
  var html = '<div class="hdr">' + headerHtml() + '</div><div class="content">';
  if(TAB==='zal') html += renderZal();
  else if(TAB==='istoria') html += renderIstoria();
  else if(TAB==='uprazh') html += renderUprazh();
  else html += renderEsche();
  html += '</div>' + tabbarHtml();
  app.innerHTML = html;
  if(TAB==='zal' && state.active){
    var fab = document.createElement('button');
    fab.id='timerFab'; fab.className='timer-fab';
    fab.innerHTML = '<span class="tlabel" style="font:700 13px var(--fm); color:var(--ink);">⏱</span><span style="font:9px var(--fm); color:var(--ink); opacity:.8;">отдых</span>';
    app.appendChild(fab);
    renderTimerFab();
  }
  if(TAB==='istoria') drawSpark();
}
function headerHtml(){
  var d = new Date();
  var dateStr = d.toLocaleDateString('ru-RU', {day:'numeric', month:'long', weekday:'long'});
  var titles = {zal:'Зал', istoria:'История', uprazh:'Упражнения', esche:'Ещё'};
  return '<div class="eyebrow">'+dateStr.toUpperCase()+'</div><h1>'+titles[TAB]+'</h1>';
}
function tabbarHtml(){
  function t(id, ic, label){ return '<button class="tab '+(TAB===id?'active':'')+'" data-tab="'+id+'"><span class="ic">'+ic+'</span>'+label+'</button>'; }
  return '<div class="tabbar">'+t('zal','🏋️','Зал')+t('istoria','📈','История')+t('uprazh','📋','Упражнения')+t('esche','⚙️','Ещё')+'</div>';
}

/* ============ ВКЛАДКА: ЗАЛ ============ */
function renderZal(){
  if(!state.active) return renderStart();
  return renderActive();
}
function renderStart(){
  var last = state.sessions[state.sessions.length-1];
  var nt = nextType();
  var info = last
    ? 'Прошлая тренировка — ' + fmtAgo(last.date) + ', тип ' + last.type + ', объём ' + Math.round(volumeOf(last)).toLocaleString('ru') + ' кг.'
    : 'Первая тренировка. Веса подтянутся автоматически начиная со второй.';
  var html = '<p class="pmuted">'+info+'</p>';
  html += '<div class="card">';
  html += '<div class="eyebrow" style="margin-bottom:8px;">Рекомендовано далее</div>';
  html += programCardBody(nt);
  html += '<div style="margin-top:12px;"><button class="btn primary" data-action="start" data-type="'+nt+'">Начать '+PROGRAM[nt].label+'</button></div>';
  html += '</div>';
  Object.keys(PROGRAM).forEach(function(k){
    if(k===nt) return;
    html += '<button class="btn ghost" style="margin-bottom:8px;" data-action="start" data-type="'+k+'">Начать '+PROGRAM[k].label+' вместо этого</button>';
  });
  return html;
}
function programCardBody(type){
  var p = PROGRAM[type];
  var html = '<div style="font-weight:700; font-size:15px;">'+p.label+'</div><div class="pmuted" style="margin:2px 0 10px;">'+p.sub+'</div>';
  if(p.note) html += '<div class="pmuted" style="margin:-4px 0 10px;">'+p.note+'</div>';
  p.items.forEach(function(it){
    var ex = exById(it.ex);
    html += '<div class="exline"><div><div class="exname">'+ex.name+(it.pair?'<span class="super-badge">суперсет</span>':'')+'</div></div><div class="exmeta">'+it.sets+'×'+it.reps+'</div></div>';
  });
  return html;
}
function renderActive(){
  var s = state.active;
  var p = PROGRAM[s.type];
  var html = '<p class="pmuted">'+p.label+' · '+p.sub+'</p>';
  s.entries.forEach(function(entry, ei){
    var ex = exById(entry.ex);
    var pr = prFor(entry.ex);
    html += '<div class="card">';
    html += '<div style="display:flex; justify-content:space-between; align-items:flex-start;">';
    html += '<div><div class="exname">'+ex.name+'</div><div class="exmeta">'+ex.group+(pr?' · PR '+pr+' кг':'')+'</div></div>';
    html += '<button class="linkbtn" data-action="rmex" data-ei="'+ei+'">✕</button>';
    html += '</div>';
    html += '<div style="margin-top:10px;">';
    entry.sets.forEach(function(set, si){
      html += '<div class="setrow '+(set.done?'done':'')+'">';
      html += '<div class="idx">'+(si+1)+'</div>';
      html += '<input class="numin" type="number" inputmode="decimal" step="0.5" placeholder="кг" value="'+(set.weight||'')+'" data-bind="weight" data-ei="'+ei+'" data-si="'+si+'">';
      html += '<input class="numin" type="number" inputmode="numeric" placeholder="повт" value="'+(set.reps||'')+'" data-bind="reps" data-ei="'+ei+'" data-si="'+si+'">';
      html += '<button class="check" data-action="toggledone" data-ei="'+ei+'" data-si="'+si+'">'+(set.done?'✓':'')+'</button>';
      html += '</div>';
    });
    html += '</div>';
    html += '<div class="row" style="margin-top:6px;">';
    html += '<button class="linkbtn" data-action="addset" data-ei="'+ei+'">+ подход</button>';
    if(entry.sets.length>0) html += '<button class="linkbtn" data-action="rmset" data-ei="'+ei+'">− подход</button>';
    if(ex.type==='barbell' || ex.type==='plate') html += '<button class="linkbtn" data-action="plates" data-ei="'+ei+'">🏋️ блины</button>';
    html += '</div>';
    if(state.uiPlatesFor===ei) html += platesBlockHtml(entry, ex);
    html += '</div>';
  });
  html += '<button class="btn ghost" data-action="addex">+ Добавить упражнение</button>';
  html += '<div style="height:8px;"></div>';
  html += '<button class="btn primary" data-action="finish">Завершить тренировку</button>';
  html += '<button class="btn danger" style="margin-top:8px;" data-action="cancel">Отменить тренировку</button>';
  return html;
}
function platesBlockHtml(entry, ex){
  var last = entry.sets.length ? entry.sets[entry.sets.length-1].weight : null;
  var target = last || lastWeightFor(entry.ex) || ex.seed || 0;
  var html = '<div class="plates">';
  if(ex.type==='plate'){
    var pl = calcSinglePlate(target);
    html += 'На блин: <span class="plate-chip"><span class="plate-dot" style="background:'+pl.c+'"></span>'+pl.w+' кг</span>';
  } else {
    var plates = calcPlates(target, state.settings.barWeight);
    if(!plates || !plates.length){ html += 'Гриф '+state.settings.barWeight+' кг — блины не нужны'; }
    else{
      html += 'Гриф '+state.settings.barWeight+' кг + на сторону: ';
      plates.forEach(function(p){ html += '<span class="plate-chip"><span class="plate-dot" style="background:'+p.c+'"></span>'+p.w+'×'+p.n+'</span>'; });
    }
  }
  html += '</div>';
  return html;
}

/* ============ ВКЛАДКА: ИСТОРИЯ ============ */
function renderIstoria(){
  if(!state.sessions.length) return '<div class="empty">Пока нет завершённых тренировок.</div>';
  var html = '<div class="card">';
  html += '<label style="margin-top:0;">Прогресс по упражнению</label>';
  html += '<select id="sparkSel">';
  var used = {};
  state.sessions.forEach(function(s){ s.entries.forEach(function(e){ used[e.ex]=true; }); });
  Object.keys(used).forEach(function(id){ var ex=exById(id); if(ex) html += '<option value="'+id+'" '+(state.uiSparkEx===id?'selected':'')+'>'+ex.name+'</option>'; });
  html += '</select>';
  html += '<svg class="spark" id="sparkSvg"></svg>';
  html += '<div id="sparkInfo" class="pmuted"></div>';
  html += '</div>';
  html += '<div class="card">';
  var list = state.sessions.slice().reverse();
  list.forEach(function(s){
    html += '<div class="hist-item"><div class="hist-top"><span>'+PROGRAM[s.type].label+'</span><span>'+Math.round(volumeOf(s)).toLocaleString('ru')+' кг</span></div>';
    html += '<div class="hist-sub">'+fmtDate(s.date)+(s.durationMin?' · '+s.durationMin+' мин':'')+'</div></div>';
  });
  html += '</div>';
  return html;
}
function drawSpark(){
  var sel = document.getElementById('sparkSel');
  if(!sel) return;
  function draw(exId){
    state.uiSparkEx = exId;
    var pts = [];
    state.sessions.forEach(function(s){
      var e = s.entries.find(function(x){ return x.ex===exId; });
      if(e && e.sets.length){
        var max=0; e.sets.forEach(function(st){ if(st.weight>max) max=st.weight; });
        if(max>0) pts.push({date:s.date, w:max});
      }
    });
    var svg = document.getElementById('sparkSvg');
    var info = document.getElementById('sparkInfo');
    if(pts.length<1){ svg.innerHTML=''; info.textContent='Ещё нет данных.'; return; }
    var W=520,H=56,pad=6;
    var minW = Math.min.apply(null, pts.map(function(p){return p.w;}));
    var maxW = Math.max.apply(null, pts.map(function(p){return p.w;}));
    if(minW===maxW){ minW -= 5; maxW += 5; }
    var stepX = pts.length>1 ? (W-2*pad)/(pts.length-1) : 0;
    var coords = pts.map(function(p,i){
      var x = pad + i*stepX;
      var y = H-pad - ((p.w-minW)/(maxW-minW))*(H-2*pad);
      return x+','+y;
    });
    var path = '<polyline fill="none" stroke="#b08d57" stroke-width="2" points="'+coords.join(' ')+'"/>';
    coords.forEach(function(c,i){ var xy=c.split(','); path += '<circle cx="'+xy[0]+'" cy="'+xy[1]+'" r="3" fill="'+(pts[i].w===maxW?'#d9a441':'#e9e7dd')+'"/>'; });
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.innerHTML = path;
    info.textContent = 'Максимум за раз: '+maxW+' кг · последний результат: '+pts[pts.length-1].w+' кг';
  }
  draw(sel.value);
  sel.onchange = function(){ draw(sel.value); };
}

/* ============ ВКЛАДКА: УПРАЖНЕНИЯ ============ */
function renderUprazh(){
  var html = '<div class="card">';
  html += '<label style="margin-top:0;">Новое упражнение</label>';
  html += '<input type="text" id="newExName" placeholder="Название">';
  html += '<div class="row" style="margin-top:8px;">';
  html += '<select id="newExType"><option value="barbell">Штанга</option><option value="dumbbell">Гантели</option><option value="machine">Тренажёр</option><option value="bodyweight">Своя масса</option><option value="plate">Блин</option></select>';
  html += '<input type="text" id="newExGroup" placeholder="Группа мышц">';
  html += '</div>';
  html += '<button class="btn" style="margin-top:8px;" data-action="addcustom">Добавить в библиотеку</button>';
  html += '</div>';
  var groups = {};
  allExercises().forEach(function(ex){ (groups[ex.group]=groups[ex.group]||[]).push(ex); });
  Object.keys(groups).forEach(function(g){
    html += '<div class="grp">'+g+'</div><div class="card">';
    groups[g].forEach(function(ex){
      var pr = prFor(ex.id);
      var custom = (state.custom||[]).some(function(c){ return c.id===ex.id; });
      html += '<div class="exline"><div><div class="exname">'+ex.name+'</div><div class="exmeta">'+typeLabel(ex.type)+(pr?' · PR '+pr+' кг':'')+'</div></div>';
      if(custom) html += '<button class="linkbtn" data-action="rmcustom" data-id="'+ex.id+'">✕</button>';
      html += '</div>';
    });
    html += '</div>';
  });
  return html;
}
function typeLabel(t){
  return {barbell:'Штанга', dumbbell:'Гантели', machine:'Тренажёр', bodyweight:'Своя масса', plate:'Блин'}[t] || t;
}

/* ============ ВКЛАДКА: ЕЩЁ ============ */
function renderEsche(){
  var html = '<div class="card">';
  html += '<div class="eyebrow" style="margin-bottom:8px;">Настройки</div>';
  html += '<label style="margin-top:0;">Вес грифа, кг</label>';
  html += '<input type="number" id="setBar" value="'+state.settings.barWeight+'">';
  html += '<label>Таймер отдыха по умолчанию, сек</label>';
  html += '<input type="number" id="setRest" value="'+state.settings.restSeconds+'">';
  html += '<button class="btn" style="margin-top:10px;" data-action="savesettings">Сохранить</button>';
  html += '</div>';
  html += '<div class="card">';
  html += '<div class="eyebrow" style="margin-bottom:8px;">Резервная копия</div>';
  html += '<p class="pmuted">Экспорт сохраняет всю историю тренировок в файл. Импорт заменяет текущие данные содержимым файла.</p>';
  html += '<div class="row"><button class="btn" data-action="export">Экспорт JSON</button><label class="btn" style="margin:0;">Импорт<input type="file" id="importFile" accept="application/json" style="display:none;"></label></div>';
  html += '</div>';
  html += '<div class="card">';
  html += '<div class="eyebrow" style="margin-bottom:8px; color:var(--danger);">Опасная зона</div>';
  html += '<button class="btn danger" data-action="resetall">Стереть все данные</button>';
  html += '</div>';
  html += '<p class="pmuted" style="text-align:center; margin-top:20px;">Железо · офлайн-трекер · данные хранятся только на этом устройстве</p>';
  return html;
}

/* ============ ДЕЙСТВИЯ ============ */
function startSession(type){
  var p = PROGRAM[type];
  var entries = p.items.map(function(it){
    var ex = exById(it.ex);
    var seedW = lastWeightFor(it.ex) || ex.seed || '';
    var sets = [];
    for(var i=0;i<it.sets;i++) sets.push({weight:seedW, reps:'', done:false});
    return {ex:it.ex, sets:sets};
  });
  state.active = { type:type, date:new Date().toISOString(), startedAt:Date.now(), entries:entries };
  save(); render();
}
function finishSession(){
  if(!confirm('Завершить и сохранить тренировку?')) return;
  var s = state.active;
  s.entries = s.entries.filter(function(e){ return e.sets.some(function(st){ return st.done; }); })
                        .map(function(e){ return {ex:e.ex, sets:e.sets.filter(function(st){ return st.done; }).map(function(st){ return {weight:parseFloat(st.weight)||0, reps:parseInt(st.reps)||0}; })}; });
  s.durationMin = Math.max(1, Math.round((Date.now()-s.startedAt)/60000));
  state.sessions.push(s);
  state.active = null;
  save(); render();
  toast('Тренировка сохранена');
}
function cancelSession(){
  if(!confirm('Отменить тренировку без сохранения?')) return;
  state.active = null; save(); render();
}
function toast(msg){
  var el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 1800);
}
function fmtDate(iso){
  var d = new Date(iso);
  return d.toLocaleDateString('ru-RU', {day:'numeric', month:'short', year:'numeric'});
}
function fmtAgo(iso){
  var days = Math.floor((Date.now()-new Date(iso).getTime())/86400000);
  if(days<=0) return 'сегодня';
  if(days===1) return 'вчера';
  return days+' дн. назад';
}

/* ============ EVENTS ============ */
document.addEventListener('click', function(e){
  var tabBtn = e.target.closest('[data-tab]');
  if(tabBtn){ TAB = tabBtn.dataset.tab; state.uiPlatesFor=null; render(); return; }

  var fab = e.target.closest('#timerFab');
  if(fab){
    if(timer.running){ clearInterval(timer.iv); timer.running=false; }
    else timerStart(timer.remaining>0 ? timer.remaining : state.settings.restSeconds);
    renderTimerFab();
    return;
  }

  var btn = e.target.closest('[data-action]');
  if(!btn) return;
  var a = btn.dataset.action;

  if(a==='start') startSession(btn.dataset.type);
  else if(a==='finish') finishSession();
  else if(a==='cancel') cancelSession();
  else if(a==='toggledone'){
    var ei=+btn.dataset.ei, si=+btn.dataset.si;
    var set = state.active.entries[ei].sets[si];
    set.done = !set.done;
    if(set.done && !timer.running) timerStart(state.settings.restSeconds);
    save(); render();
  }
  else if(a==='addset'){
    var ei2=+btn.dataset.ei;
    var entry = state.active.entries[ei2];
    var lastW = entry.sets.length ? entry.sets[entry.sets.length-1].weight : (lastWeightFor(entry.ex)||'');
    entry.sets.push({weight:lastW, reps:'', done:false});
    save(); render();
  }
  else if(a==='rmset'){
    var ei3=+btn.dataset.ei;
    state.active.entries[ei3].sets.pop();
    save(); render();
  }
  else if(a==='rmex'){
    state.active.entries.splice(+btn.dataset.ei,1);
    save(); render();
  }
  else if(a==='addex'){
    var name = prompt('Название упражнения из библиотеки (точно как в списке "Упражнения"):');
    if(!name) return;
    var found = allExercises().find(function(x){ return x.name.toLowerCase()===name.toLowerCase(); });
    if(!found){ alert('Не найдено. Проверьте вкладку «Упражнения».'); return; }
    var sets=[]; for(var i=0;i<3;i++) sets.push({weight:lastWeightFor(found.id)||found.seed||'', reps:'', done:false});
    state.active.entries.push({ex:found.id, sets:sets});
    save(); render();
  }
  else if(a==='plates'){
    var ei4=+btn.dataset.ei;
    state.uiPlatesFor = state.uiPlatesFor===ei4 ? null : ei4;
    render();
  }
  else if(a==='addcustom'){
    var nm = document.getElementById('newExName').value.trim();
    var ty = document.getElementById('newExType').value;
    var gr = document.getElementById('newExGroup').value.trim() || 'Другое';
    if(!nm){ alert('Введите название'); return; }
    var id = 'c_'+nm.toLowerCase().replace(/[^a-zа-яё0-9]+/gi,'_')+'_'+Date.now();
    state.custom = state.custom || [];
    state.custom.push({id:id, name:nm, type:ty, group:gr});
    save(); render();
  }
  else if(a==='rmcustom'){
    state.custom = state.custom.filter(function(c){ return c.id!==btn.dataset.id; });
    save(); render();
  }
  else if(a==='savesettings'){
    state.settings.barWeight = parseFloat(document.getElementById('setBar').value)||20;
    state.settings.restSeconds = parseInt(document.getElementById('setRest').value)||90;
    save(); toast('Настройки сохранены');
  }
  else if(a==='export'){
    var blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a2 = document.createElement('a');
    a2.href = url; a2.download = 'zhelezo_backup_'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a2); a2.click(); a2.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }
  else if(a==='resetall'){
    if(confirm('Все тренировки и настройки будут удалены безвозвратно. Продолжить?')){
      if(confirm('Точно? Это действие нельзя отменить.')){
        state = { sessions:[], active:null, custom:[], settings:{barWeight:20, restSeconds:90} };
        save(); render();
      }
    }
  }
});

document.addEventListener('input', function(e){
  var el = e.target;
  if(el.dataset && el.dataset.bind && state.active){
    var ei=+el.dataset.ei, si=+el.dataset.si;
    state.active.entries[ei].sets[si][el.dataset.bind] = el.value;
    save();
  }
});

document.addEventListener('change', function(e){
  if(e.target.id==='importFile'){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      try{
        var data = JSON.parse(ev.target.result);
        if(!data.sessions) throw new Error('bad file');
        if(confirm('Заменить текущие данные содержимым файла?')){
          state = data;
          state.settings = state.settings || {barWeight:20, restSeconds:90};
          state.custom = state.custom || [];
          save(); render(); toast('Данные восстановлены');
        }
      }catch(err){ alert('Не удалось прочитать файл.'); }
    };
    reader.readAsText(file);
  }
});

/* ============ INIT ============ */
render();
</script>
